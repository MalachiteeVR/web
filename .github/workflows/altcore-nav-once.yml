name: Add Altcore navigation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-navigation:
    if: ${{ !contains(github.event.head_commit.message, 'Apply Altcore navigation') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add Altcore to HTML navigation
        shell: python
        run: |
          from pathlib import Path
          import re

          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              original = text

              # The old external Altcore button should now lead to the MalachiteVR landing page.
              text = text.replace('href="https://altcore.app/"', 'href="altcore.html"')

              if path.name != 'altcore.html' and 'href="altcore.html"' not in text:
                  nav_match = re.search(r'<nav\\b[^>]*>.*?</nav>', text, flags=re.I | re.S)
                  if nav_match:
                      nav = nav_match.group(0)
                      if 'class="nav-links"' in nav:
                          nav = nav.replace('</ul>', '  <li><a href="altcore.html">Altcore</a></li>\n    </ul>', 1)
                      else:
                          nav = nav.replace('</nav>', '  <a href="altcore.html">Altcore</a>\n</nav>', 1)
                      text = text[:nav_match.start()] + nav + text[nav_match.end():]

              if text != original:
                  path.write_text(text, encoding='utf-8')

      - name: Commit navigation changes and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          rm -f .github/workflows/altcore-nav-once.yml
          git add .github/workflows/altcore-nav-once.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Apply Altcore navigation"
          git push
