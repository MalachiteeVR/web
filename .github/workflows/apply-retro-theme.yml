name: Apply 2000s Retro Theme

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  theme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add retro theme to site pages
        run: |
          python3 <<'PY'
          from pathlib import Path

          excluded = {
              'abuseipdb-verification.html',
              'malachite-times-php-security.html',
          }
          marker = '<link rel="stylesheet" href="retro-2000s.css" />'

          for path in Path('.').glob('*.html'):
              if path.name in excluded:
                  continue
              text = path.read_text(encoding='utf-8')
              if marker in text or '</head>' not in text.lower():
                  continue
              idx = text.lower().rfind('</head>')
              text = text[:idx] + '  ' + marker + '\n' + text[idx:]
              path.write_text(text, encoding='utf-8')
              print(f'Updated {path.name}')
          PY

      - name: Remove one-shot workflow
        run: rm -f .github/workflows/apply-retro-theme.yml

      - name: Commit and push theme update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' .github/workflows/apply-retro-theme.yml
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Apply 2000s retro web theme"
          git push
