name: Update XML sitemap

on:
  push:
    branches:
      - main
    paths:
      - '**.html'

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate sitemap from published HTML pages
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          from xml.sax.saxutils import escape

          base = "https://malachitevr.win"
          excluded = {"abuseipdb-verification.html"}
          pages = sorted(
              path.name for path in Path(".").glob("*.html")
              if path.is_file() and path.name not in excluded
          )

          urls = []
          for page in pages:
              loc = f"{base}/" if page == "index.html" else f"{base}/{page}"
              urls.append(f"  <url><loc>{escape(loc)}</loc></url>")

          xml = (
              '<?xml version="1.0" encoding="UTF-8"?>\n'
              '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n'
              + "\n".join(urls)
              + "\n</urlset>\n"
          )
          Path("sitemap.xml").write_text(xml, encoding="utf-8")
          PY

      - name: Commit sitemap when it changes
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "Sitemap is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "chore: update sitemap"
          git push
